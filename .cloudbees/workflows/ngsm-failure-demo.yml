# ngsm-failure-demo.yml
#
# Dedicated failure-scenario demo, separate from ngsm-release.yml so the
# main release flow stays deterministic. Demonstrates the gap Evan
# called out: closing the loop from a failed run to a Jira ticket, the
# way Jennifer's team's "auto Jira" already does today.
#
# NOTE on how this checks for failure: steps.<id>.outcome/.conclusion
# are NOT available in this runtime - confirmed directly by the engine's
# own error message, which only lists "outputs" as a supported field on
# a step. So the failing step explicitly writes result=failure to
# $CLOUDBEES_OUTPUTS itself before exiting, and downstream steps check
# that output value instead of relying on an implicit outcome field.
#
# Requires these vars/secrets set on this component in Unify:
#   vars.JIRA_URL            e.g. https://your-domain.atlassian.net
#   vars.JIRA_PROJECT_KEY    e.g. NGSM
#   secrets.JIRA_USERNAME    the email tied to the Jira API token
#   secrets.JIRA_TOKEN       generated at id.atlassian.com/manage-profile/security/api-tokens

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ngsm-failure-demo

on:
  workflow_dispatch:

jobs:

  simulate-and-report-failure:
    steps:
      - name: Check out repository
        uses: cloudbees-io/checkout@v2

      - id: simulate-failure
        name: Deploy via login-node gateway (deliberately fails)
        uses: docker://bash:5.2
        shell: sh
        continue-on-error: true
        run: |
          bash scripts/simulate-node-failure.sh "https://artifactory.example.internal/hpe-releases/ngsm/${{ cloudbees.version }}/ngsm-release.iso"

      - name: Create Jira ticket for failed node
        if: ${{ steps.simulate-failure.outputs.result == 'failure' }}
        uses: docker://curlimages/curl:8.10.1
        shell: sh
        run: |
          curl -s -w "\nHTTP %{http_code}\n" \
            -u "${{ secrets.JIRA_USERNAME }}:${{ secrets.JIRA_TOKEN }}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{
              "fields": {
                "project": { "key": "${{ vars.JIRA_PROJECT_KEY }}" },
                "summary": "ngsm-release build ${{ cloudbees.version }} failed on Cluster Node N",
                "description": "Automated ticket from Unify RO. Install failed during the hpc-test-cluster deployment: 2 of 3 nodes succeeded, Cluster Node N reported a package dependency mismatch after the heartbeat check. Artifact: ngsm-release-iso, version ${{ cloudbees.version }}.",
                "issuetype": { "name": "Bug" }
              }
            }' \
            "${{ vars.JIRA_URL }}/rest/api/2/issue"

      - name: Post failure status to Slack
        if: ${{ steps.simulate-failure.outputs.result == 'failure' }}
        uses: docker://bash:5.2
        shell: sh
        run: |
          echo "Posting to Slack #hpc-releases:"
          echo "ngsm-release ${{ cloudbees.version }} FAILED on Cluster Node N — Jira ticket auto-created, see above for details."

      - name: Reflect the real outcome
        if: ${{ steps.simulate-failure.outputs.result == 'failure' }}
        uses: docker://bash:5.2
        shell: sh
        run: |
          echo "Failing this run to reflect the actual node failure (continue-on-error only kept later steps executing)."
          exit 1
