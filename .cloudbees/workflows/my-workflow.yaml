apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
jobs:
  build:
    steps:
      - name: Say Hello
        id: say-hello
        uses: docker://golang:1.20.3-alpine3.17
        continue-on-error: true
        shell: sh
        run: |
          echo "hello world"
          exit 1
          echo "result=failure" >> $CLOUDBEES_OUTPUTS
        

      - name: My turn
        id: my-turn
        uses: docker://golang:1.20.3-alpine3.17
        if: ${{steps.say-hello.outputs.result == 'failure'}}
        shell: sh
        run: |
          echo: "I failed, but still ran"
